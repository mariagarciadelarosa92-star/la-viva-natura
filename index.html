<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#244c3a"><link rel="manifest" href="manifest.json">
<title>La Viva Natura · Plant Journal</title>
<style>
:root{--bg:#f7f1e4;--paper:#fffaf0;--g:#244c3a;--s:#a9b99b;--ls:#e7ecdd;--b:#6e5848;--t:#b98262;--l:#d8d4c5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--g);font-family:system-ui,-apple-system,sans-serif}.app{max-width:720px;margin:auto;padding-bottom:78px}
header{padding:24px 18px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font:27px Georgia,serif}.tag{font-size:11px;color:var(--b);font-style:italic}.plus,.secondary,.nav button{border:1px solid var(--l);background:var(--paper);color:var(--g);border-radius:13px}.plus{width:42px;height:42px;font-size:23px}
main{padding:0 15px}.hero{margin:8px 0 15px;padding:21px;border:1px solid var(--l);border-radius:22px;background:linear-gradient(135deg,#e9eedf,#f9f1e1)}h1{font:23px Georgia,serif;margin:0 0 5px}.hero p{margin:0;color:var(--b);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.card{background:var(--paper);border:1px solid var(--l);border-radius:17px}.stat{text-align:center;padding:12px}.stat b{display:block;font:23px Georgia,serif}.stat span{font-size:10px;color:#737b6e}
.head{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.head h2{font:18px Georgia,serif;margin:0}.link{border:0;background:none;color:var(--t);font-size:12px}.card{padding:13px;margin-bottom:9px}
.plant{display:flex;align-items:center;gap:12px}.pic{width:58px;height:58px;border-radius:15px;background:var(--ls);display:grid;place-items:center;font-size:29px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.pname{font:17px Georgia,serif}.meta{font-size:11px;color:#737b6e;margin-top:3px}.pill{margin-left:auto;background:var(--ls);padding:6px 8px;border-radius:99px;font-size:10px;white-space:nowrap}.attention{background:#f4dfc7}.recover{background:#ead8d6}.prop{background:#dce7ea}.flower{background:#eee0ea}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fffaf0f2;border-top:1px solid var(--l);z-index:4}.navin{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;border-radius:0;background:none;padding:9px;font-size:10px}.nav button.active{font-weight:700}.nav i{display:block;font-style:normal;font-size:20px}
.secondary{padding:9px 12px}.modal{display:none;position:fixed;inset:0;background:#244c3a55;z-index:10;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:620px;margin:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:19px;max-height:90vh;overflow:auto}.sheettop{display:flex;justify-content:space-between}.sheet h2{font:22px Georgia,serif;margin:0 0 14px}.close{border:0;background:var(--ls);border-radius:50%;width:34px;height:34px}.form{display:grid;gap:10px}.field label{display:block;font-size:11px;color:#737b6e;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--l);border-radius:11px;background:#fffdf7;color:var(--g)}textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary{border:0;background:var(--g);color:#fff;padding:12px;border-radius:12px;font-weight:700}.detail{display:flex;gap:14px;align-items:center;margin:12px 0 18px}.bigpic{width:86px;height:86px;border-radius:20px;background:var(--ls);display:grid;place-items:center;font-size:42px;overflow:hidden}.bigpic img{width:100%;height:100%;object-fit:cover}.event{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #e5e0d3}.event:last-child{border:0}.eventico{width:34px;height:34px;border-radius:10px;background:var(--ls);display:grid;place-items:center}.event small{display:block;color:#737b6e;margin-top:3px}.empty{text-align:center;color:#737b6e;padding:28px}.empty b{display:block;color:var(--g);font:20px Georgia,serif;margin-bottom:5px}
</style></head>
<body>
<div class="app"><header><div><div class="brand">La Viva Natura</div><div class="tag">Plant Journal · Care · Grow · Observe</div></div><button class="plus" onclick="addPlant()">＋</button></header><main id="main"></main></div>
<nav class="nav"><div class="navin"><button id="nh" onclick="go('home')"><i>🏡</i>Home</button><button id="np" onclick="go('plants')"><i>🪴</i>Plants</button><button id="nj" onclick="go('journal')"><i>📖</i>Journal</button></div></nav>
<div class="modal" id="modal"><div class="sheet"><div class="sheettop"><h2 id="mt"></h2><button class="close" onclick="closeM()">×</button></div><div id="mb"></div></div></div>
<script>
const K='lvn-v1';let S=JSON.parse(localStorage.getItem(K)||'null')||{plants:[{id:1,name:'Monstera deliciosa',location:'Living room',light:'Bright indirect',status:'Healthy & happy',photo:'',notes:'Loves morning light.',events:[]},{id:2,name:'Hoya carnosa',location:'Bedroom',light:'Bright indirect',status:'Flowering',photo:'',notes:'Watch for new buds.',events:[]},{id:3,name:'Pothos',location:'Terrace',light:'Indirect',status:'Propagating',photo:'',notes:'Cutting in water.',events:[]}],journal:[]};let page='home',id=null;
const save=()=>localStorage.setItem(K,JSON.stringify(S));const esc=x=>String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cls=s=>s.includes('attention')?'attention':s.includes('recover')?'recover':s.includes('propagat')?'prop':s.includes('flower')?'flower':'';
function go(p,i=null){page=p;id=i;render();document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById(p==='home'?'nh':p==='journal'?'nj':'np').classList.add('active')}
function card(p){return `<div class="card" onclick="go('detail',${p.id})"><div class="plant"><div class="pic">${p.photo?`<img src="${p.photo}">`:'🌿'}</div><div><div class="pname">${esc(p.name)}</div><div class="meta">${esc(p.location)} · ${esc(p.light)}</div></div><span class="pill ${cls(p.status)}">${esc(p.status)}</span></div></div>`}
function home(){let a=S.plants.filter(p=>p.status==='Needs attention').length,r=S.plants.filter(p=>p.status==='Propagating').length;return `<div class="hero"><h1>A little home for your green friends.</h1><p>Keep track of the plants you love, one small moment at a time.</p></div><div class="stats"><div class="stat"><b>${S.plants.length}</b><span>plants</span></div><div class="stat"><b>${a}</b><span>need attention</span></div><div class="stat"><b>${r}</b><span>propagating</span></div></div><div class="head"><h2>My Plants</h2><button class="link" onclick="go('plants')">View all →</button></div>${S.plants.slice(0,4).map(card).join('')||'<div class="card empty"><b>Your collection is waiting.</b>Add your first plant.</div>'}<div class="head"><h2>Quick care</h2></div><div class="card"><div class="event"><div class="eventico">💧</div><div><b>Care events</b><small>Open a plant to record watering, feeding, pruning and more.</small></div></div><div class="event"><div class="eventico">🌱</div><div><b>Growth moments</b><small>Use the journal whenever you notice something new.</small></div></div></div>`}
function plants(){return `<div class="head"><h2>My Plant Collection</h2><button class="secondary" onclick="addPlant()">＋ Add plant</button></div>${S.plants.map(card).join('')||'<div class="card empty"><b>No plants yet.</b>Add your first green friend.</div>'}`}
function detail(){let p=S.plants.find(x=>x.id===id);if(!p)return plants();return `<button class="link" onclick="go('plants')">← My plants</button><div class="detail"><div class="bigpic">${p.photo?`<img src="${p.photo}">`:'🌿'}</div><div><h1>${esc(p.name)}</h1><div class="meta">${esc(p.location)} · ${esc(p.light)}</div><span class="pill ${cls(p.status)}" style="display:inline-block;margin-top:8px">${esc(p.status)}</span></div></div><div class="card"><div class="head"><h2>Care history</h2><button class="link" onclick="care()">＋ Add care</button></div>${p.events.length?p.events.slice().reverse().map(e=>`<div class="event"><div class="eventico">${e.icon}</div><div><b>${esc(e.type)}</b><small>${esc(e.date)}${e.note?' · '+esc(e.note):''}</small></div></div>`).join(''):'<div class="empty">No care events yet.</div>'}</div><div class="card"><div class="head"><h2>Plant notes</h2></div><div class="meta" style="font-size:13px;color:var(--b)">${esc(p.notes||'Add observations about this plant.')}</div></div><div style="display:flex;gap:8px"><button class="secondary" onclick="editPlant()">Edit</button><button class="secondary" onclick="delPlant()">Delete</button></div>`}
function journal(){return `<div class="head"><h2>Botanical Journal</h2><button class="secondary" onclick="newNote()">＋ New note</button></div>${S.journal.slice().reverse().map(j=>`<div class="card"><div class="event"><div class="eventico">${j.icon}</div><div><b>${esc(j.title)}</b><small>${esc(j.date)} · ${esc(j.plant||'Collection')}</small><div style="margin-top:7px;color:var(--b);font-size:13px">${esc(j.text)}</div></div></div></div>`).join('')||'<div class="card empty"><b>Today I noticed…</b>Record a new leaf, flower, light change, problem, or something beautiful.</div>'}`}
function render(){document.getElementById('main').innerHTML=page==='plants'?plants():page==='detail'?detail():page==='journal'?journal():home()}go('home');
function openM(t,b){mt.textContent=t;mb.innerHTML=b;modal.classList.add('open')}function closeM(){modal.classList.remove('open')}
function addPlant(){openM('Add a plant',`<form class="form" onsubmit="savePlant(event)"><div class="field"><label>Plant name</label><input id="n" required placeholder="Monstera deliciosa"></div><div class="grid"><div class="field"><label>Location</label><input id="l" placeholder="Living room"></div><div class="field"><label>Light</label><select id="i"><option>Bright light</option><option selected>Bright indirect</option><option>Indirect</option><option>Low light</option></select></div></div><div class="field"><label>Status</label><select id="s"><option>Healthy & happy</option><option>Needs attention</option><option>In recovery</option><option>Propagating</option><option>Flowering</option></select></div><div class="field"><label>Notes</label><textarea id="o" placeholder="Anything you want to remember…"></textarea></div><button class="primary">Save plant</button></form>`)}
function savePlant(e){e.preventDefault();S.plants.push({id:Date.now(),name:n.value,location:l.value||'Other',light:i.value,status:s.value,notes:o.value,photo:'',events:[]});save();closeM();go('plants')}
function editPlant(){let p=S.plants.find(x=>x.id===id);openM('Edit plant',`<form class="form" onsubmit="updatePlant(event)"><div class="field"><label>Plant name</label><input id="n" required value="${esc(p.name)}"></div><div class="grid"><div class="field"><label>Location</label><input id="l" value="${esc(p.location)}"></div><div class="field"><label>Light</label><select id="i">${['Bright light','Bright indirect','Indirect','Low light'].map(x=>`<option ${x===p.light?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Status</label><select id="s">${['Healthy & happy','Needs attention','In recovery','Propagating','Flowering'].map(x=>`<option ${x===p.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Notes</label><textarea id="o">${esc(p.notes)}</textarea></div><button class="primary">Save changes</button></form>`)}
function updatePlant(e){e.preventDefault();let p=S.plants.find(x=>x.id===id);p.name=n.value;p.location=l.value;p.light=i.value;p.status=s.value;p.notes=o.value;save();closeM();render()}
function delPlant(){if(confirm('Delete this plant?')){S.plants=S.plants.filter(x=>x.id!==id);save();go('plants')}}
function care(){openM('Add care event',`<form class="form" onsubmit="saveCare(event)"><div class="field"><label>Care</label><select id="ct"><option>💧 Watered</option><option>🌱 Fertilized</option><option>✂️ Pruned</option><option>🧽 Cleaned leaves</option><option>🔄 Rotated</option><option>🪴 Repotted</option></select></div><div class="field"><label>Note</label><input id="cn" placeholder="Soil was dry…"></div><button class="primary">Save care event</button></form>`)}
function saveCare(e){e.preventDefault();let p=S.plants.find(x=>x.id===id),v=ct.value;p.events.push({icon:v.slice(0,2),type:v.slice(2).trim(),date:new Date().toLocaleDateString('es-ES'),note:cn.value});save();closeM();render()}
function newNote(){openM('New journal note',`<form class="form" onsubmit="saveNote(event)"><div class="grid"><div class="field"><label>What did you notice?</label><select id="ji"><option>🌱 New leaf</option><option>🌸 Flower</option><option>🍃 New growth</option><option>☀️ Light change</option><option>🩺 Problem</option><option>❤️ Something beautiful</option></select></div><div class="field"><label>Plant</label><select id="jp"><option value="">Collection</option>${S.plants.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select></div></div><div class="field"><label>Observation</label><textarea id="jt" required placeholder="Today I noticed…"></textarea></div><button class="primary">Save note</button></form>`)}
function saveNote(e){e.preventDefault();let v=ji.value;S.journal.push({icon:v.slice(0,2),title:v.slice(2).trim(),plant:jp.value,date:new Date().toLocaleDateString('es-ES'),text:jt.value});save();closeM();go('journal')}
</script></body></html>
