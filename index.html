<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e4">
<link rel="manifest" href="manifest.json">
<title>La Viva Natura · Diario de Plantas</title>
<meta name="app-version" content="5.0-es">
<style>
:root{--paper:#f5f0e4;--paper2:#fffaf1;--ink:#285447;--ink2:#49685f;--muted:#7c8179;--line:#ddd6c7;--sage:#e7eee0;--sage2:#d7e4cd;--terra:#c88968;--danger:#9b5a51;--gold:#b28a4a;--shadow:0 8px 24px rgba(55,70,50,.07)}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:980px;margin:auto;min-height:100vh;padding-bottom:88px}header{padding:24px 22px 12px;display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:rgba(245,240,228,.94);backdrop-filter:blur(12px);z-index:10}.brand h1{font:28px Georgia,serif;margin:0}.brand p{margin:2px 0 0;color:#7c6659;font-style:italic;font-size:14px}.header-actions{display:flex;gap:8px}.iconbtn{width:45px;height:45px;border:1px solid var(--line);border-radius:15px;background:var(--paper2);color:var(--ink);font-size:21px;box-shadow:var(--shadow)}main{padding:0 22px}.hero{background:linear-gradient(135deg,#e7eee0,#f8f1e3);border:1px solid #dcd7c8;border-radius:26px;padding:25px;margin:10px 0 18px}.hero h2{font:28px Georgia,serif;margin:0 0 6px}.hero p{margin:0;color:#77685e}.hero .sub{font-size:13px;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--paper2);border:1px solid var(--line);border-radius:19px;padding:15px;text-align:center}.stat strong{font:26px Georgia,serif;display:block}.stat span{font-size:12px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 10px}.sectionhead h3{font:22px Georgia,serif;margin:0}.linkbtn{border:0;background:none;color:var(--terra);padding:4px}.card,.plant-card,.action-card{background:var(--paper2);border:1px solid var(--line);border-radius:22px;padding:15px;margin:10px 0;box-shadow:var(--shadow)}.plant-card{display:flex;gap:14px;align-items:center}.thumb{width:82px;height:82px;border-radius:19px;background:var(--sage);display:grid;place-items:center;overflow:hidden;flex:none}.thumb img{width:100%;height:100%;object-fit:cover}.leaf{font-size:31px}.plant-info{min-width:0;flex:1}.plant-info h4{font:20px Georgia,serif;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plant-info p{margin:0;color:#7b8178;font-size:14px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.pill{display:inline-block;background:var(--sage);border-radius:999px;padding:6px 9px;font-size:11px;color:var(--ink2);white-space:nowrap}.pill.attention{background:#f1e2d8;color:#8b5c49}.plant-actions{display:flex;gap:7px}.smallbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 10px}.smallbtn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.search{display:flex;gap:8px;margin:14px 0}.search input{flex:1;padding:13px 15px;border:1px solid var(--line);border-radius:15px;background:var(--paper2);outline:none}.filter{padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--paper2)}.empty{text-align:center;color:var(--muted);padding:35px 10px}.dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dashboard-card{min-height:140px}.dashboard-card h4{font:18px Georgia,serif;margin:0 0 6px}.dashboard-card .count{font:27px Georgia,serif}.mini-list{margin-top:9px}.mini-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.mini-row:first-child{border-top:0}.mini-row .mini-photo{width:38px;height:38px;border-radius:11px;background:var(--sage);overflow:hidden;display:grid;place-items:center;flex:none}.mini-photo img{width:100%;height:100%;object-fit:cover}.mini-row strong{display:block}.mini-row span{display:block;color:var(--muted);font-size:11px}.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick-actions button{background:var(--paper2);border:1px solid var(--line);border-radius:17px;padding:13px 7px;color:var(--ink);min-height:76px}.quick-actions b{display:block;font-size:22px;margin-bottom:4px}.quick-actions span{font-size:11px}.collection-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.collection-tile{margin:0;padding:0;overflow:hidden}.collection-tile .bigphoto{height:185px;background:var(--sage);display:grid;place-items:center;overflow:hidden}.bigphoto img{width:100%;height:100%;object-fit:cover}.collection-tile .tilebody{padding:13px}.collection-tile h4{font:20px Georgia,serif;margin:0 0 3px}.collection-tile p{margin:0;color:var(--muted);font-size:13px}.detailHero{display:flex;gap:15px;align-items:center;margin:5px 0 16px}.detailPhoto{width:118px;height:118px;border-radius:28px;background:var(--sage);overflow:hidden;display:grid;place-items:center;font-size:42px;flex:none}.detailPhoto img{width:100%;height:100%;object-fit:cover}.detailHero h2{font:29px Georgia,serif;margin:0 0 5px}.detailHero p{margin:0;color:var(--muted);font-size:14px}.detailHero .edit{margin-top:10px}.profileGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}.profileGrid .stat{padding:13px 8px}.profileGrid .stat strong{font-size:21px}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 9px}.tabs button{border:1px solid var(--line);background:var(--paper2);color:var(--ink2);border-radius:999px;padding:9px 12px;white-space:nowrap}.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:1px;background:var(--line)}.event{position:relative;margin:0 0 15px}.event:before{content:"";position:absolute;left:-20px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--terra);border:3px solid var(--paper2)}.event strong{display:block}.event small{color:var(--muted)}.event p{margin:5px 0 0;color:#5f6d65;font-size:14px}.progress{height:8px;border-radius:99px;background:var(--sage);overflow:hidden}.progress i{display:block;height:100%;background:var(--terra);border-radius:99px}.photoRow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.miniPhotoLarge{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--sage)}.miniPhotoLarge img{width:100%;height:100%;object-fit:cover}.note{background:#f7efe3;border-left:4px solid var(--terra);padding:11px 13px;border-radius:10px;color:#6d645b;font-size:13px}.overlay{position:fixed;inset:0;background:rgba(35,48,41,.38);z-index:40;display:flex;align-items:flex-end}.sheet{background:var(--paper2);width:100%;max-height:94vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 20px 35px}.sheethead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--paper2);z-index:2;padding-bottom:10px}.sheet h2{font:26px Georgia,serif;margin:0}.close{border:0;background:var(--sage);width:40px;height:40px;border-radius:13px;color:var(--ink)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--paper2);padding:12px;outline:none}.field textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.primary,.secondary,.danger{border:0;border-radius:14px;padding:12px 16px}.primary{background:var(--ink);color:#fff}.secondary{background:var(--sage);color:var(--ink)}.danger{background:#f0ded8;color:var(--danger)}.photoBox{height:210px;border:1px dashed #cfc7b5;border-radius:20px;background:var(--sage);display:grid;place-items:center;overflow:hidden;margin-bottom:12px}.photoBox img{width:100%;height:100%;object-fit:cover}.photoBox label{padding:12px 16px;background:var(--paper2);border:1px solid var(--line);border-radius:13px}.hidden{display:none!important}.fab{position:fixed;right:22px;bottom:78px;width:58px;height:58px;border:0;border-radius:20px;background:var(--ink);color:#fff;font-size:28px;box-shadow:0 10px 25px rgba(40,84,71,.25);z-index:15}nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,250,241,.96);backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:30}nav .navinner{max-width:980px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}nav button{border:0;background:none;color:#7c8178;padding:10px 4px 9px;font-size:10px}nav button.active{color:var(--ink);font-weight:700}nav .ni{display:block;font-size:20px;margin-bottom:2px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calhead{font-size:10px;color:var(--muted);text-align:center;padding:4px}.calday{min-height:72px;border:1px solid var(--line);border-radius:10px;background:var(--paper2);padding:6px;font-size:11px}.calday.today{border:2px solid var(--terra)}.calday .num{font-weight:700}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--terra);margin:2px}.season-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.season{padding:18px;background:var(--paper2);border:1px solid var(--line);border-radius:22px}.season h4{font:21px Georgia,serif;margin:0 0 7px}.season p{color:var(--muted);font-size:13px;line-height:1.5}.checklist label{display:flex;gap:9px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13px}.checklist label:first-child{border-top:0}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;z-index:70;box-shadow:var(--shadow);font-size:13px}.version{font-size:10px;color:var(--muted);text-align:center;margin:14px}.dangerText{color:var(--danger)}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.profileGrid{grid-template-columns:repeat(2,1fr)}.collection-grid{grid-template-columns:1fr}.quick-actions{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.dashboard-grid{grid-template-columns:1fr}.season-grid{grid-template-columns:1fr}.photoRow{grid-template-columns:repeat(3,1fr)}}
@media(min-width:760px){.sheet{max-width:780px;margin:auto;border-radius:28px}.overlay{align-items:center;padding:20px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='lvn_plants_v5';
const JKEY='lvn_journal_v5';
const SETTINGS='lvn_settings_v5';
const APP_VERSION='V5.0';
let plants=[], journal=[], notes=[], settings={};
let screen='home', selected=null, detailTab='summary', collectionSearch='', collectionFilter='all', modal=null;

const TEXT={
 status:{healthy:'Saludable y feliz',flowering:'En flor',growing:'Creciendo',propagating:'En propagación',attention:'Necesita atención',recovering:'Recuperándose'},
 event:{Watered:'Riego',Fertilized:'Abonado',Pruned:'Poda',Rotated:'Rotación',Repotted:'Trasplante','Leaves cleaned':'Limpieza de hojas',Other:'Otro'},
 method:{Water:'Agua',Soil:'Tierra',Sphagnum:'Esfagno',Perlite:'Perlita','Air layering':'Acodo aéreo'},
 health:{Monitoring:'En observación',Improving:'Mejorando',Recovered:'Recuperada',Ongoing:'En curso'},
 propagation:{Starting:'Iniciando',Rooting:'Enraizando',Established:'Establecida',Failed:'Fallida'}
};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(d){if(!d)return '—';return new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'short',year:'numeric'}).format(new Date(d+'T12:00:00'))}
function daysAgo(d){if(!d)return 999;return Math.floor((Date.now()-new Date(d+'T12:00:00'))/86400000)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function getPlant(id){return plants.find(p=>p.id===id)}
function save(){localStorage.setItem(KEY,JSON.stringify(plants));localStorage.setItem(JKEY,JSON.stringify(journal));localStorage.setItem(SETTINGS,JSON.stringify(settings))}
function load(){
 try{plants=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('lvn_plants_v1')||'[]');journal=JSON.parse(localStorage.getItem(JKEY)||localStorage.getItem('lvn_journal_v2')||'[]');settings=JSON.parse(localStorage.getItem(SETTINGS)||'{}')}catch(e){plants=[];journal=[];settings={}}
 plants=plants.map(p=>({...p,id:p.id||uid(),name:p.name||'Planta sin nombre',species:p.species||'',location:p.location||'',light:p.light||'',status:p.status||'healthy',wateringEvery:Number(p.wateringEvery)||7,notes:p.notes||'',events:p.events||[],propagations:p.propagations||[],health:p.health||[],photos:p.photos||[],milestones:p.milestones||[],created:p.created||today()}));
 if(!settings.name)settings.name='';
 save();
}
function statusLabel(s){return TEXT.status[s]||s||'Sin estado'}
function eventLabel(s){return TEXT.event[s]||s||'Evento'}
function methodLabel(s){return TEXT.method[s]||s||''}
function healthLabel(s){return TEXT.health[s]||s||''}
function propagationLabel(s){return TEXT.propagation[s]||s||''}
function thumb(p){return p?.photos?.[0]?`<img src="${p.photos[0]}" alt="">`:`<span class="leaf">🌿</span>`}
function lastWater(p){return p.events.filter(e=>e.type==='Watered').sort((a,b)=>b.date.localeCompare(a.date))[0]}
function nextWater(p){const last=lastWater(p);if(!last)return null;return new Date(new Date(last.date+'T12:00:00').getTime()+p.wateringEvery*86400000).toISOString().slice(0,10)}
function waterDue(p){const n=nextWater(p);return n && n<=today()}
function openHealth(p){return p.health.filter(h=>h.status!=='Recovered')}
function daysText(n){if(n===0)return 'hoy';if(n===1)return 'hace 1 día';return `hace ${n} días`}
function greeting(){const h=new Date().getHours();return h<13?'Buenos días':h<20?'Buenas tardes':'Buenas noches'}
function compressImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.82))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function openModal(type,data={}){modal={type,...data};renderModal()}
function closeModal(){modal=null;renderModal()}
function renderModal(){document.querySelector('.overlay')?.remove();if(!modal)return;document.body.insertAdjacentHTML('beforeend',modalHTML());bindModal()}
function modalHTML(){
 const m=modal.type;
 if(m==='plant')return `<div class="overlay"><div class="sheet"><div class="sheethead"><h2>${modal.id?'Editar planta':'Añadir planta'}</h2><button class="close" onclick="closeModal()">×</button></div><form id="plantForm"><div class="photoBox" id="plantPhotoBox">${modal.photo?`<img src="${modal.photo}">`:'<label>📷 Añadir foto<input id="plantPhoto" type="file" accept="image/*" class="hidden"></label>'}</div>${modal.photo?'<button type="button" class="secondary" id="changePlantPhoto">Cambiar foto</button>':''}<div class="formgrid"><div class="field"><label>Nombre para identificarla *</label><input name="name" required value="${esc(modal.name||'') }" placeholder="Monstera del salón"></div><div class="field"><label>Especie *</label><input name="species" required value="${esc(modal.species||'') }" placeholder="Monstera deliciosa"></div><div class="field"><label>Estado</label><select name="status"><option value="healthy">Saludable y feliz</option><option value="flowering">En flor</option><option value="growing">Creciendo</option><option value="propagating">En propagación</option><option value="attention">Necesita atención</option><option value="recovering">Recuperándose</option></select></div><div class="field"><label>Ubicación</label><input name="location" value="${esc(modal.location||'')}" placeholder="Salón"></div><div class="field"><label>Luz</label><input name="light" value="${esc(modal.light||'')}" placeholder="Luz indirecta brillante"></div><div class="field"><label>Riego cada (días)</label><input name="wateringEvery" type="number" min="1" value="${modal.wateringEvery||7}"></div><div class="field full"><label>Notas</label><textarea name="notes" placeholder="Detalles que quieras recordar...">${esc(modal.notes||'')}</textarea></div></div><div class="actions"><button class="primary" type="submit">${modal.id?'Guardar cambios':'Añadir planta'}</button><button class="secondary" type="button" onclick="closeModal()">Cancelar</button>${modal.id?'<button class="danger" type="button" id="deletePlant">Eliminar planta</button>':''}</div></form></div></div>`;
 if(m==='event')return `<div class="overlay"><div class="sheet"><div class="sheethead"><h2>Registrar cuidado</h2><button class="close" onclick="closeModal()">×</button></div><form id="eventForm"><div class="note">🌿 ${esc(getPlant(modal.plantId)?.name||'Planta')}</div><div class="formgrid"><div class="field"><label>Tipo</label><select name="type"><option value="Watered">Riego</option><option value="Fertilized">Abonado</option><option value="Pruned">Poda</option><option value="Rotated">Rotación</option><option value="Repotted">Trasplante</option><option value="Leaves cleaned">Limpieza de hojas</option><option value="Other">Otro</option></select></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}"></div><div class="field full"><label>Observaciones</label><textarea name="note" placeholder="¿Qué hiciste? ¿Cómo estaba la planta?"></textarea></div></div><div class="actions"><button class="primary">Guardar cuidado</button><button class="secondary" type="button" onclick="closeModal()">Cancelar</button></div></form></div></div>`;
 if(m==='health')return `<div class="overlay"><div class="sheet"><div class="sheethead"><h2>Registrar salud</h2><button class="close" onclick="closeModal()">×</button></div><form id="healthForm"><div class="formgrid"><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>Estado</label><select name="status"><option value="Monitoring">En observación</option><option value="Ongoing">En curso</option><option value="Improving">Mejorando</option><option value="Recovered">Recuperada</option></select></div><div class="field"><label>Problema</label><input name="issue" placeholder="Hojas amarillas, plaga..."></div><div class="field"><label>Síntomas</label><input name="symptoms" placeholder="Describe lo que ves"></div><div class="field full"><label>Tratamiento / qué has cambiado</label><textarea name="treatment"></textarea></div><div class="field full"><label>Observaciones</label><textarea name="notes"></textarea></div></div><div class="actions"><button class="primary">Guardar registro</button><button class="secondary" type="button" onclick="closeModal()">Cancelar</button></div></form></div></div>`;
 if(m==='prop')return `<div class="overlay"><div class="sheet"><div class="sheethead"><h2>Nueva propagación</h2><button class="close" onclick="closeModal()">×</button></div><form id="propForm"><div class="formgrid"><div class="field"><label>Nombre / identificación</label><input name="name" placeholder="Esqueje 1"></div><div class="field"><label>Fecha de inicio</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>Método</label><select name="method"><option value="Water">Agua</option><option value="Soil">Tierra</option><option value="Sphagnum">Esfagno</option><option value="Perlite">Perlita</option><option value="Air layering">Acodo aéreo</option></select></div><div class="field"><label>Estado</label><select name="status"><option value="Starting">Iniciando</option><option value="Rooting">Enraizando</option><option value="Established">Establecida</option><option value="Failed">Fallida</option></select></div><div class="field"><label>Medio</label><input name="medium" placeholder="Agua, sustrato..."></div><div class="field"><label>Hormona de enraizamiento</label><select name="hormone"><option>No</option><option>Sí</option></select></div><div class="field full"><label>Cambios / mantenimiento</label><textarea name="changes" placeholder="Cambios de agua, humedad, sustrato..."></textarea></div><div class="field full"><label>Observaciones</label><textarea name="observations"></textarea></div></div><div class="actions"><button class="primary">Guardar propagación</button><button class="secondary" type="button" onclick="closeModal()">Cancelar</button></div></form></div></div>`;
 if(m==='journal')return `<div class="overlay"><div class="sheet"><div class="sheethead"><h2>Nuevo momento botánico</h2><button class="close" onclick="closeModal()">×</button></div><form id="journalForm"><div class="formgrid"><div class="field"><label>Planta</label><select name="plantId"><option value="">Momento general</option>${plants.map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(p.species)}</option>`).join('')}</select></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>Tipo de momento</label><select name="type"><option>🌱 Nueva hoja</option><option>🌸 Floración</option><option>🌿 Nuevo crecimiento</option><option>☀️ Cambio de luz</option><option>🩺 Problema</option><option>✨ Algo bonito</option><option>📷 Foto de crecimiento</option><option>📝 Nota</option></select></div><div class="field full"><label>Texto</label><textarea name="text" placeholder="Cuenta qué ocurrió..."></textarea></div></div><div class="actions"><button class="primary">Guardar en el diario</button><button class="secondary" type="button" onclick="closeModal()">Cancelar</button></div></form></div></div>`;
 if(m==='note')return `<div class="overlay"><div class="sheet"><div class="sheethead"><h2>Nueva nota</h2><button class="close" onclick="closeModal()">×</button></div><form id="noteForm"><div class="field"><label>Título</label><input name="title" placeholder="Una idea, observación, lista..."></div><div class="field"><label>Nota</label><textarea name="text" style="min-height:220px"></textarea></div><div class="actions"><button class="primary">Guardar nota</button><button class="secondary" type="button" onclick="closeModal()">Cancelar</button></div></form></div></div>`;
 if(m==='export')return `<div class="overlay"><div class="sheet"><div class="sheethead"><h2>Datos y ajustes</h2><button class="close" onclick="closeModal()">×</button></div><div class="card"><h3 style="font-family:Georgia,serif">Copia de seguridad</h3><p style="color:var(--muted)">Guarda una copia de tus plantas, cuidados, propagaciones, salud y diario en un archivo.</p><div class="actions"><button class="primary" id="exportBtn">Exportar datos</button><label class="secondary">Importar datos<input id="importInput" type="file" accept="application/json" class="hidden"></label></div></div><div class="card"><h3 style="font-family:Georgia,serif">Personalización</h3><div class="field"><label>Tu nombre</label><input id="userName" value="${esc(settings.name||'') }" placeholder="María"></div><button class="primary" id="saveSettings">Guardar</button></div><div class="card"><h3 style="font-family:Georgia,serif">Zona de pruebas</h3><button class="danger" id="resetDemo">Restaurar datos de ejemplo</button></div><div class="version">La Viva Natura · ${APP_VERSION}</div></div></div>`;
 return '';
}
function bindModal(){
 const m=modal?.type;if(!m)return;
 if(m==='plant'){
  const form=document.getElementById('plantForm');let photo=modal.photo||'';const input=document.getElementById('plantPhoto');if(input)input.onchange=async()=>{if(input.files[0]){photo=await compressImage(input.files[0]);document.getElementById('plantPhotoBox').innerHTML=`<img src="${photo}">`}};document.getElementById('changePlantPhoto')?.addEventListener('click',()=>{let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(i.files[0]){photo=await compressImage(i.files[0]);document.getElementById('plantPhotoBox').innerHTML=`<img src="${photo}">`}};i.click()});form.querySelector('[name=status]').value=modal.status||'healthy';form.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));if(modal.id){const p=getPlant(modal.id);Object.assign(p,{name:d.name,species:d.species,status:d.status,location:d.location,light:d.light,wateringEvery:Number(d.wateringEvery)||7,notes:d.notes,photos:photo?[photo]:p.photos})}else{plants.push({id:uid(),name:d.name,species:d.species,status:d.status,location:d.location,light:d.light,wateringEvery:Number(d.wateringEvery)||7,notes:d.notes,photos:photo?[photo]:[],events:[],propagations:[],health:[],milestones:[],created:today()})}save();closeModal();render();toast(modal.id?'Planta actualizada':'Planta añadida')};document.getElementById('deletePlant')?.addEventListener('click',()=>{if(confirm('¿Eliminar esta planta y todo su historial?')){plants=plants.filter(p=>p.id!==modal.id);save();closeModal();screen='plants';selected=null;render()}})
 }
 if(m==='event')document.getElementById('eventForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));getPlant(modal.plantId).events.push({id:uid(),...d});save();closeModal();render();toast('Cuidado guardado')};
 if(m==='health')document.getElementById('healthForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));getPlant(modal.plantId).health.push({id:uid(),...d});save();closeModal();render();toast('Registro de salud guardado')};
 if(m==='prop')document.getElementById('propForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));getPlant(modal.plantId).propagations.push({id:uid(),...d,photos:[]});save();closeModal();render();toast('Propagación guardada')};
 if(m==='journal')document.getElementById('journalForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));journal.unshift({id:uid(),...d});save();closeModal();render();toast('Momento guardado')};
 if(m==='note')document.getElementById('noteForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));notes.unshift({id:uid(),...d,date:today()});save();localStorage.setItem('lvn_notes_v5',JSON.stringify(notes));closeModal();render();toast('Nota guardada')};
 if(m==='export'){document.getElementById('exportBtn').onclick=()=>{const data={version:APP_VERSION,exportedAt:new Date().toISOString(),plants,journal,notes,settings};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='la-viva-natura-backup.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);plants=d.plants||[];journal=d.journal||[];notes=d.notes||[];settings=d.settings||{};save();localStorage.setItem('lvn_notes_v5',JSON.stringify(notes));closeModal();render();toast('Datos importados')}catch(err){alert('El archivo no es válido.')}};r.readAsText(f)};document.getElementById('saveSettings').onclick=()=>{settings.name=document.getElementById('userName').value.trim();save();closeModal();render();toast('Ajustes guardados')};document.getElementById('resetDemo').onclick=()=>{if(confirm('Esto sustituirá tus datos actuales por datos de ejemplo. ¿Continuar?')){localStorage.removeItem(KEY);localStorage.removeItem(JKEY);location.reload()}}}
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function nav(active){return `<nav><div class="navinner"><button class="${active==='home'?'active':''}" onclick="go('home')"><span class="ni">🏡</span>Inicio</button><button class="${active==='plants'?'active':''}" onclick="go('plants')"><span class="ni">🌿</span>Plantas</button><button class="${active==='calendar'?'active':''}" onclick="go('calendar')"><span class="ni">🗓️</span>Plan</button><button class="${active==='journal'?'active':''}" onclick="go('journal')"><span class="ni">📖</span>Diario</button><button class="${active==='guide'?'active':''}" onclick="go('guide')"><span class="ni">🌱</span>Guía</button></div></nav>`}
function header(){return `<header><div class="brand"><h1>La Viva Natura</h1><p>Cuida · Observa · Crece</p></div><div class="header-actions"><button class="iconbtn" onclick="openModal('export')">⚙️</button><button class="iconbtn" onclick="openModal('plant')">＋</button></div></header>`}
function go(s){screen=s;selected=null;detailTab='summary';render();window.scrollTo({top:0,behavior:'smooth'})}
function openPlant(id){selected=id;screen='detail';detailTab='summary';render();window.scrollTo({top:0,behavior:'smooth'})}
function plantCard(p,grid=false){const due=waterDue(p);return `<div class="${grid?'card collection-tile':'plant-card'} ${due?'due':''}" ${grid?'onclick="openPlant(\''+p.id+'\')"':''}>${grid?`<div class="bigphoto">${thumb(p)}</div><div class="tilebody"><h4>${esc(p.name)}</h4><p>${esc(p.species)}</p><div class="meta"><span class="pill">${statusLabel(p.status)}</span>${due?'<span class="pill attention">💧 Riego</span>':''}</div></div>`:`<div class="thumb">${thumb(p)}</div><div class="plant-info"><h4>${esc(p.name)}</h4><p><em>${esc(p.species)}</em></p><div class="meta"><span class="pill">${statusLabel(p.status)}</span>${p.location?`<span class="pill">🏠 ${esc(p.location)}</span>`:''}${due?'<span class="pill attention">💧 Riego pendiente</span>':''}</div></div><div class="plant-actions"><button class="smallbtn primary" onclick="openPlant('${p.id}')">Ver</button><button class="smallbtn" onclick="openModal('event',{plantId:'${p.id}'})">💧</button></div>`}</div>`}
function home(){const due=plants.filter(waterDue), health=plants.filter(p=>openHealth(p).length), activeProps=plants.flatMap(p=>p.propagations.filter(x=>x.status==='Starting'||x.status==='Rooting').map(x=>({...x,plant:p}))), week=plants.reduce((n,p)=>n+p.events.filter(e=>daysAgo(e.date)<=7).length,0);return `<main>${header()}<section class="hero"><div class="dashboardHero"><div><h2>${greeting()}${settings.name?', '+esc(settings.name):''} 🌿</h2><p>${due.length?`Hoy ${due.length===1?'hay una planta':'hay '+due.length+' plantas'} que necesitan atención.`:'Todo tranquilo por ahora. Es un buen momento para observar.'}</p><p class="sub">Tu colección tiene ${plants.length} ${plants.length===1?'planta':'plantas'} y esta semana has registrado ${week} cuidados.</p></div><span class="version">${APP_VERSION}</span></div></section><div class="stats"><div class="stat"><strong>${plants.length}</strong><span>Plantas</span></div><div class="stat"><strong>${due.length}</strong><span>Riegos pendientes</span></div><div class="stat"><strong>${health.length}</strong><span>Para revisar</span></div><div class="stat"><strong>${activeProps.length}</strong><span>En propagación</span></div></div><div class="sectionhead"><h3>Hoy</h3></div><div class="dashboard-grid"><div class="card dashboard-card"><h4>💧 Riego</h4><div class="count">${due.length}</div><div class="mini-list">${due.slice(0,3).map(p=>`<div class="mini-row"><div class="mini-photo">${thumb(p)}</div><div style="flex:1"><strong>${esc(p.name)}</strong><span>Riego cada ${p.wateringEvery} días</span></div><button class="smallbtn" onclick="openModal('event',{plantId:'${p.id}'})">Regar</button></div>`).join('')||'<div class="dashboardEmpty">No hay riegos pendientes.</div>'}</div></div><div class="card dashboard-card"><h4>🩺 Atención</h4><div class="count">${health.length}</div><div class="mini-list">${health.slice(0,3).map(p=>`<div class="mini-row" onclick="openPlant('${p.id}')"><div class="mini-photo">${thumb(p)}</div><div><strong>${esc(p.name)}</strong><span>${esc(openHealth(p)[0].issue||'Revisar estado')}</span></div></div>`).join('')||'<div class="dashboardEmpty">No hay problemas abiertos.</div>'}</div></div></div><div class="sectionhead"><h3>En crecimiento</h3><button class="linkbtn" onclick="go('plants')">Ver plantas →</button></div><div class="card"><div class="mini-list">${activeProps.slice(0,4).map(x=>{const age=daysAgo(x.date);return `<div class="mini-row" onclick="openPlant('${x.plant.id}')"><div class="mini-photo">${thumb(x.plant)}</div><div style="flex:1"><strong>${esc(x.name||'Propagación')} · ${esc(x.plant.name)}</strong><span>${methodLabel(x.method)} · ${age} días · ${propagationLabel(x.status)}</span></div><span>🌱</span></div>`}).join('')||'<div class="dashboardEmpty">No tienes propagaciones activas.</div>'}</div></div><div class="sectionhead"><h3>Acciones rápidas</h3></div><div class="quick-actions"><button onclick="openModal('plant')"><b>🌿</b><span>Añadir planta</span></button><button onclick="openModal('event',{plantId:plants[0]?.id})"><b>💧</b><span>Registrar cuidado</span></button><button onclick="openModal('journal')"><b>📖</b><span>Nuevo momento</span></button><button onclick="openModal('note')"><b>📝</b><span>Nueva nota</span></button></div><div class="sectionhead"><h3>Tus plantas</h3><button class="linkbtn" onclick="go('plants')">Ver colección →</button></div>${plants.slice(0,4).map(p=>plantCard(p)).join('')}${nav('home')}</main><button class="fab" onclick="openModal('plant')">＋</button>`}
function plantsView(){let arr=plants.filter(p=>(p.name+' '+p.species+' '+p.location).toLowerCase().includes(collectionSearch.toLowerCase()));if(collectionFilter==='attention')arr=arr.filter(waterDue);if(collectionFilter==='prop')arr=arr.filter(p=>p.propagations.some(x=>x.status!=='Failed'));if(collectionFilter==='healthy')arr=arr.filter(p=>p.status==='healthy');return `<main>${header()}<div class="sectionhead"><h2 style="font:28px Georgia,serif;margin:0">Mi colección</h2><span class="pill">${plants.length} plantas</span></div><div class="search"><input id="plantSearch" placeholder="Buscar por nombre, especie o ubicación..." value="${esc(collectionSearch)}"><select id="plantFilter" class="filter"><option value="all">Todas</option><option value="attention">Riego pendiente</option><option value="prop">Con propagación</option><option value="healthy">Saludables</option></select></div><div class="collection-grid">${arr.map(p=>plantCard(p,true)).join('')||'<div class="empty" style="grid-column:1/-1">No hemos encontrado plantas.</div>'}</div>${nav('plants')}</main><button class="fab" onclick="openModal('plant')">＋</button>`}
function detailView(){const p=getPlant(selected);if(!p){screen='plants';return plantsView()}const events=[...p.events.map(e=>({...e,date:e.date,title:eventLabel(e.type),text:e.note,icon:e.type==='Watered'?'💧':e.type==='Fertilized'?'🌱':e.type==='Repotted'?'🪴':'✨'})),...p.health.map(h=>({...h,title:'Salud · '+(h.issue||'Revisión'),text:h.symptoms||h.treatment,icon:'🩺'})),...p.propagations.map(x=>({...x,date:x.date,title:'Propagación · '+(x.name||'Esqueje'),text:methodLabel(x.method)+' · '+propagationLabel(x.status),icon:'🌱'})),...journal.filter(j=>j.plantId===p.id).map(j=>({...j,title:j.type,text:j.text,icon:'📖'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||''));const next=nextWater(p);return `<main>${header()}<button class="linkbtn" onclick="go('plants')">← Volver a mi colección</button><div class="detailHero"><div class="detailPhoto">${thumb(p)}</div><div style="flex:1"><h2>${esc(p.name)}</h2><p><em>${esc(p.species)}</em></p><div class="meta"><span class="pill">${statusLabel(p.status)}</span>${p.location?`<span class="pill">🏠 ${esc(p.location)}</span>`:''}</div><button class="smallbtn edit" onclick="openModal('plant',{id:'${p.id}',name:${JSON.stringify(p.name)},species:${JSON.stringify(p.species)},status:'${p.status}',location:${JSON.stringify(p.location)},light:${JSON.stringify(p.light)},wateringEvery:${p.wateringEvery},notes:${JSON.stringify(p.notes)},photo:${JSON.stringify(p.photos?.[0]||'') }})">Editar ficha</button></div></div><div class="profileGrid"><div class="stat"><strong>${p.events.length}</strong><span>Cuidados</span></div><div class="stat"><strong>${p.propagations.length}</strong><span>Propagaciones</span></div><div class="stat"><strong>${p.health.length}</strong><span>Salud</span></div><div class="stat"><strong>${next?fmt(next):'—'}</strong><span>Próximo riego</span></div></div><div class="tabs">${[['summary','Resumen'],['care','Cuidados'],['growth','Crecimiento'],['health','Salud'],['prop','Propagación'],['journal','Diario']].map(([k,l])=>`<button class="${detailTab===k?'active':''}" onclick="detailTab='${k}';render()">${l}</button>`).join('')}</div>${detailTab==='summary'?summaryTab(p,next):detailTab==='care'?careTab(p):detailTab==='growth'?growthTab(p,events):detailTab==='health'?healthTab(p):detailTab==='prop'?propTab(p):journalTab(p)}${nav('plants')}</main>`}
function summaryTab(p,next){return `<div class="card"><h3 style="font:21px Georgia,serif">Tu planta</h3><div class="formgrid"><div><small>Ubicación</small><strong>${esc(p.location||'No indicada')}</strong></div><div><small>Luz</small><strong>${esc(p.light||'No indicada')}</strong></div><div><small>Riego</small><strong>Cada ${p.wateringEvery} días</strong></div><div><small>Último riego</small><strong>${lastWater(p)?fmt(lastWater(p).date):'Sin registrar'}</strong></div></div>${p.notes?`<div class="note" style="margin-top:13px">${esc(p.notes)}</div>`:''}</div><div class="sectionhead"><h3>Acciones</h3></div><div class="quick-actions"><button onclick="openModal('event',{plantId:'${p.id}'})"><b>💧</b><span>Registrar cuidado</span></button><button onclick="openModal('health',{plantId:'${p.id}'})"><b>🩺</b><span>Registrar salud</span></button><button onclick="openModal('prop',{plantId:'${p.id}'})"><b>🌱</b><span>Propagar</span></button><button onclick="openModal('journal',{plantId:'${p.id}'})"><b>📖</b><span>Momento</span></button></div><div class="sectionhead"><h3>Últimas fotos</h3></div><div class="photoRow">${p.photos.map(x=>`<div class="miniPhotoLarge"><img src="${x}"></div>`).join('')||'<div class="empty" style="grid-column:1/-1">Añade una foto para empezar su historia visual.</div>'}</div>`}
function careTab(p){const ev=[...p.events].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="actions"><button class="primary" onclick="openModal('event',{plantId:'${p.id}'})">＋ Registrar cuidado</button></div><div class="timeline">${ev.map(e=>`<div class="event"><strong>${e.type==='Watered'?'💧 ':''}${eventLabel(e.type)}</strong><small>${fmt(e.date)}</small>${e.note?`<p>${esc(e.note)}</p>`:''}</div>`).join('')||'<div class="empty">Todavía no hay cuidados registrados.</div>'}</div>`}
function growthTab(p,events){return `<div class="card"><h3 style="font:21px Georgia,serif">Historia de ${esc(p.name)}</h3><p style="color:var(--muted);font-size:13px">Todo lo que registras aquí forma una línea temporal de su vida.</p></div><div class="timeline">${events.map(e=>`<div class="event"><strong>${e.icon||'🌿'} ${esc(e.title)}</strong><small>${fmt(e.date)}</small>${e.text?`<p>${esc(e.text)}</p>`:''}</div>`).join('')||'<div class="empty">Aún no hay momentos en la historia.</div>'}</div>`}
function healthTab(p){return `<div class="actions"><button class="primary" onclick="openModal('health',{plantId:'${p.id}'})">＋ Registrar problema / revisión</button></div>${p.health.slice().reverse().map(h=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><strong>🩺 ${esc(h.issue||'Revisión')}</strong><div style="color:var(--muted);font-size:12px">${fmt(h.date)} · ${healthLabel(h.status)}</div></div><span class="pill">${healthLabel(h.status)}</span></div>${h.symptoms?`<p><b>Síntomas:</b> ${esc(h.symptoms)}</p>`:''}${h.treatment?`<p><b>Tratamiento:</b> ${esc(h.treatment)}</p>`:''}${h.notes?`<p>${esc(h.notes)}</p>`:''}</div>`).join('')||'<div class="empty">No hay registros de salud.</div>'}`}
function propTab(p){return `<div class="actions"><button class="primary" onclick="openModal('prop',{plantId:'${p.id}'})">＋ Nueva propagación</button></div>${p.propagations.slice().reverse().map(x=>{const age=daysAgo(x.date);return `<div class="card"><div style="display:flex;justify-content:space-between"><div><strong>🌱 ${esc(x.name||'Propagación')}</strong><div style="color:var(--muted);font-size:12px">${fmt(x.date)} · ${age} días</div></div><span class="pill">${propagationLabel(x.status)}</span></div><p><b>Método:</b> ${methodLabel(x.method)} · <b>Medio:</b> ${esc(x.medium||'—')}</p><div class="progress"><i style="width:${x.status==='Starting'?20:x.status==='Rooting'?60:x.status==='Established'?100:10}%"></i></div>${x.changes?`<p><b>Mantenimiento:</b> ${esc(x.changes)}</p>`:''}${x.observations?`<p>${esc(x.observations)}</p>`:''}</div>`}).join('')||'<div class="empty">Todavía no has registrado propagaciones.</div>'}`}
function journalTab(p){const rows=journal.filter(j=>j.plantId===p.id).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="actions"><button class="primary" onclick="openModal('journal',{plantId:'${p.id}'})">＋ Nuevo momento</button></div>${rows.map(j=>`<div class="card"><strong>${esc(j.type)}</strong><div style="color:var(--muted);font-size:12px">${fmt(j.date)}</div><p>${esc(j.text||'')}</p></div>`).join('')||'<div class="empty">Todavía no hay momentos en su diario.</div>'}`}
function calendarView(){const now=new Date(),year=now.getFullYear(),month=now.getMonth(),first=new Date(year,month,1).getDay()||7,last=new Date(year,month+1,0).getDate();const cells=[];for(let i=1;i<first;i++)cells.push('<div></div>');for(let d=1;d<=last;d++){const date=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,events=plants.flatMap(p=>p.events.filter(e=>e.date===date).map(e=>e.type)).length+journal.filter(j=>j.date===date).length;cells.push(`<div class="calday ${date===today()?'today':''}"><span class="num">${d}</span>${events?`<div>${Array(Math.min(events,4)).fill('<i class="dot"></i>').join('')}</div>`:''}</div>`)}return `<main>${header()}<div class="sectionhead"><h2 style="font:28px Georgia,serif;margin:0">Plan del mes</h2><span class="pill">${new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}).format(now)}</span></div><div class="card"><div class="calendar"><div class="calhead">L</div><div class="calhead">M</div><div class="calhead">X</div><div class="calhead">J</div><div class="calhead">V</div><div class="calhead">S</div><div class="calhead">D</div>${cells.join('')}</div></div><div class="sectionhead"><h3>Próximos cuidados</h3></div>${plants.filter(p=>nextWater(p)).sort((a,b)=>nextWater(a).localeCompare(nextWater(b))).slice(0,8).map(p=>`<div class="plant-card"><div class="thumb">${thumb(p)}</div><div class="plant-info"><h4>${esc(p.name)}</h4><p>Próximo riego · ${fmt(nextWater(p))}</p></div><button class="smallbtn" onclick="openPlant('${p.id}')">Ver</button></div>`).join('')||'<div class="empty">Registra un primer riego para empezar a planificar.</div>'}${nav('calendar')}</main>`}
function journalView(){const rows=[...journal].sort((a,b)=>b.date.localeCompare(a.date));return `<main>${header()}<div class="sectionhead"><h2 style="font:28px Georgia,serif;margin:0">Diario botánico</h2><button class="smallbtn primary" onclick="openModal('journal')">＋ Momento</button></div><div class="card"><p style="color:var(--muted);margin:0">Guarda las pequeñas cosas que hacen especial cuidar de tus plantas.</p></div>${rows.map(j=>{const p=getPlant(j.plantId);return `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><strong>${esc(j.type)}</strong><small style="color:var(--muted)">${fmt(j.date)}</small></div>${p?`<div class="pill" style="margin-top:7px">${esc(p.name)}</div>`:''}<p>${esc(j.text||'')}</p></div>`}).join('')||'<div class="empty">Tu diario está vacío. Empieza registrando una nueva hoja, flor, crecimiento o momento bonito.</div>'}${nav('journal')}</main>`}
function guideView(){return `<main>${header()}<div class="sectionhead"><h2 style="font:28px Georgia,serif;margin:0">Guía de temporada</h2></div><div class="card"><p style="color:var(--muted);margin:0">Una referencia rápida para adaptar tus cuidados a lo largo del año. Las necesidades reales dependen de cada planta, ubicación y clima.</p></div><div class="season-grid"><div class="season"><h4>🌱 Primavera</h4><p>Retoma el crecimiento. Observa brotes nuevos, revisa raíces, empieza a aumentar el riego solo cuando el sustrato lo pida y valora abonados suaves.</p></div><div class="season"><h4>☀️ Verano</h4><p>Más luz y calor suelen aumentar el consumo de agua. Vigila hojas, ventilación, sol directo y deshidratación, especialmente en terrazas.</p></div><div class="season"><h4>🍂 Otoño</h4><p>Reduce gradualmente el riego si baja el consumo. Revisa plagas antes de llevar plantas al interior y observa cambios de luz.</p></div><div class="season"><h4>❄️ Invierno</h4><p>Menor crecimiento y menos luz suelen requerir menos riego. Evita encharcamientos y protege las plantas sensibles del frío y corrientes.</p></div></div><div class="sectionhead"><h3>Ideas para revisar</h3></div><div class="card checklist"><label><input type="checkbox"> Revisar plagas</label><label><input type="checkbox"> Limpiar hojas</label><label><input type="checkbox"> Revisar ubicación y luz</label><label><input type="checkbox"> Revisar drenaje y sustrato</label><label><input type="checkbox"> Revisar propagaciones</label></div>${nav('guide')}</main>`}
function render(){document.getElementById('app').innerHTML=screen==='home'?home():screen==='plants'?plantsView():screen==='detail'?detailView():screen==='calendar'?calendarView():screen==='journal'?journalView():guideView();bindGlobal()}
function bindGlobal(){const s=document.getElementById('plantSearch');if(s)s.oninput=e=>{collectionSearch=e.target.value;render();const el=document.getElementById('plantSearch');el.focus();el.setSelectionRange(el.value.length,el.value.length)};const f=document.getElementById('plantFilter');if(f){f.value=collectionFilter;f.onchange=e=>{collectionFilter=e.target.value;render()}}}
load();try{notes=JSON.parse(localStorage.getItem('lvn_notes_v5')||'[]')}catch(e){notes=[]}render();
</script>
</body>
</html>
