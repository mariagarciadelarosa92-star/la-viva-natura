<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e4">
<link rel="manifest" href="manifest.json">
<title>La Viva Natura · Diario de Plantas</title>
<meta name="app-version" content="4.1-es">
<style>
:root{
  --paper:#f6f0e3;--paper2:#fbf7ee;--ink:#285447;--ink2:#48665d;
  --muted:#7c8076;--line:#ddd6c7;--sage:#e8eee0;--sage2:#dce7d2;
  --terra:#c98968;--white:#fffaf1;--danger:#9b5a51;--shadow:0 8px 24px rgba(55,70,50,.07);
}
*{box-sizing:border-box} html,body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:92px}
header{padding:28px 22px 14px;display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:rgba(246,240,227,.94);backdrop-filter:blur(12px);z-index:5}
.brand h1{font-family:Georgia,serif;font-size:28px;margin:0 0 2px}.brand p{margin:0;color:#7c6659;font-style:italic;font-size:14px}
.iconbtn{width:48px;height:48px;border:1px solid var(--line);border-radius:17px;background:var(--white);color:var(--ink);font-size:28px;box-shadow:var(--shadow)}
main{padding:0 22px}.hero{background:linear-gradient(135deg,#e9eee0,#f8f1e3);border:1px solid #dcd7c8;border-radius:26px;padding:25px;margin:10px 0 18px}.hero h2{font:28px Georgia,serif;margin:0 0 6px}.hero p{margin:0;color:#77685e}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center}.stat strong{font:27px Georgia,serif;display:block}.stat span{font-size:12px;color:var(--muted)}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 10px}.sectionhead h3{font:22px Georgia,serif;margin:0}.linkbtn{border:0;background:none;color:var(--terra);padding:4px}
.plant-card,.card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.plant-card{display:flex;gap:14px;align-items:center}.thumb{width:78px;height:78px;border-radius:18px;background:var(--sage);display:grid;place-items:center;overflow:hidden;flex:none}.thumb img{width:100%;height:100%;object-fit:cover}.leaf{font-size:31px}.plant-info{min-width:0;flex:1}.plant-info h4{font:20px Georgia,serif;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plant-info p{margin:0;color:#7b8178;font-size:14px}.pill{display:inline-block;background:var(--sage);border-radius:999px;padding:7px 10px;font-size:12px;color:var(--ink2);white-space:nowrap}
.quick{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:8px 16px}.quickrow{padding:13px 0;display:flex;gap:12px;align-items:center}.quickrow+.quickrow{border-top:1px solid var(--line)}.qicon{width:38px;height:38px;border-radius:13px;background:var(--sage);display:grid;place-items:center;font-size:20px}.quickrow strong{display:block}.quickrow span{color:var(--muted);font-size:13px}
.search{display:flex;gap:8px;margin:14px 0}.search input{flex:1;padding:13px 15px;border:1px solid var(--line);border-radius:15px;background:var(--white);outline:none}.filter{padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--white)}
.empty{text-align:center;color:var(--muted);padding:35px 10px}.fab{position:fixed;right:22px;bottom:80px;width:58px;height:58px;border:0;border-radius:20px;background:var(--ink);color:white;font-size:28px;box-shadow:0 10px 25px rgba(40,84,71,.25)}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(251,247,238,.96);backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}nav .navinner{max-width:900px;width:100%;display:grid;grid-template-columns:repeat(3,1fr)}nav button{border:0;background:none;color:#7c8178;padding:11px 4px 10px;font-size:11px}nav button.active{color:var(--ink);font-weight:700}nav .ni{display:block;font-size:21px;margin-bottom:2px}
.overlay{position:fixed;inset:0;background:rgba(35,48,41,.38);z-index:30;display:flex;align-items:flex-end}.sheet{background:var(--paper2);width:100%;max-height:94vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 20px 35px}.sheethead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--paper2);z-index:2;padding-bottom:10px}.sheet h2{font:26px Georgia,serif;margin:0}.close{border:0;background:var(--sage);width:40px;height:40px;border-radius:13px;color:var(--ink)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--white);padding:12px;outline:none}.field textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:9px;margin-top:16px}.primary,.secondary,.danger{border:0;border-radius:14px;padding:12px 16px}.primary{background:var(--ink);color:white}.secondary{background:var(--sage);color:var(--ink)}.danger{background:#f0ded8;color:var(--danger)}
.photoBox{height:190px;border:1px dashed #cfc7b5;border-radius:20px;background:var(--sage);display:grid;place-items:center;overflow:hidden;margin-bottom:12px}.photoBox img{width:100%;height:100%;object-fit:cover}.photoBox label{padding:12px 16px;background:var(--white);border:1px solid var(--line);border-radius:13px}
.detailHero{display:flex;gap:15px;align-items:center;margin:5px 0 16px}.detailPhoto{width:105px;height:105px;border-radius:25px;background:var(--sage);overflow:hidden;display:grid;place-items:center;font-size:40px;flex:none}.detailPhoto img{width:100%;height:100%;object-fit:cover}.detailHero h2{font:27px Georgia,serif;margin:0 0 5px}.detailHero p{margin:0;color:var(--muted);font-size:14px}
.profileGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}.profileGrid .stat{padding:13px 8px}.profileGrid .stat strong{font-size:22px}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 9px}.tabs button{border:1px solid var(--line);background:var(--white);color:var(--ink2);border-radius:999px;padding:9px 12px;white-space:nowrap}.tabs button.active{background:var(--ink);color:white;border-color:var(--ink)}
.timeline{position:relative;padding-left:22px}.timeline:before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:1px;background:var(--line)}.event{position:relative;margin:0 0 15px}.event:before{content:"";position:absolute;left:-19px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--terra);border:3px solid var(--paper2)}.event strong{display:block}.event small{color:var(--muted)}.event p{margin:5px 0 0;color:#5f6d65;font-size:14px}
.photoRow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.miniPhoto{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--sage)}.miniPhoto img{width:100%;height:100%;object-fit:cover}
.badgeAttention{background:#f1e2d8;color:#8b5c49}.due{border-left:4px solid var(--terra)}
.hidden{display:none!important}
@media(min-width:700px){.sheet{max-width:760px;margin:auto;border-radius:28px 28px 0 0}.overlay{align-items:center;padding:20px}.formgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const KEY='lvn_plants_v1';
const APP_VERSION='V4.2';
const JKEY='lvn_journal_v2';
let plants=[], journal=[], screen='home', selected=null, search='', filter='all', detailTab='summary';

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function load(){
  try{plants=JSON.parse(localStorage.getItem(KEY)||'[]'); journal=JSON.parse(localStorage.getItem(JKEY)||'[]')}catch(e){plants=[];journal=[]}
  plants=plants.map(p=>({...p,id:p.id||uid(),species:p.species||'',events:p.events||[],propagations:p.propagations||[],health:p.health||[],photos:p.photos||[],wateringEvery:p.wateringEvery||7,status:p.status||'Healthy & happy'}));
  if(!plants.length){
    plants=[
      {id:uid(),name:'Monstera del salón',species:'Monstera deliciosa',location:'Living room',light:'Bright indirect',status:'Healthy & happy',wateringEvery:7,notes:'',events:[{id:uid(),type:'Watered',date:today(),note:'First care log'}],propagations:[],health:[],photos:[]},
      {id:uid(),name:'Hoya del dormitorio',species:'Hoya carnosa',location:'Bedroom',light:'Bright indirect',status:'Flowering',wateringEvery:10,notes:'',events:[],propagations:[],health:[],photos:[]},
      {id:uid(),name:'Pothos de la terraza',species:'Epipremnum aureum',location:'Terrace',light:'Indirect',status:'Propagating',wateringEvery:7,notes:'',events:[],propagations:[{id:uid(),name:'Cutting 1',date:today(),method:'Water',medium:'Water',hormone:'No',changes:'',observations:'',status:'Rooting',photos:[]}],health:[],photos:[]}
    ];
    save();
  }
}
function save(){localStorage.setItem(KEY,JSON.stringify(plants));localStorage.setItem(JKEY,JSON.stringify(journal))}
function getPlant(id){return plants.find(p=>p.id===id)}
function daysAgo(d){if(!d)return 999;return Math.floor((Date.now()-new Date(d+'T12:00:00'))/86400000)}
function nextWater(p){let last=p.events.filter(e=>e.type==='Watered').sort((a,b)=>b.date.localeCompare(a.date))[0];if(!last)return null;return new Date(new Date(last.date+'T12:00:00').getTime()+p.wateringEvery*86400000).toISOString().slice(0,10)}
function attention(p){let n=nextWater(p);return n && n<=today()}
function plantThumb(p,large=false){return p.photos?.[0]?`<img src="${p.photos[0]}" alt="">`:`<span class="leaf">🌿</span>`}
function statusLabel(s){return ({'Healthy & happy':'Saludable y feliz','Flowering':'En flor','Growing':'Creciendo','Propagating':'En propagación','Needs attention':'Necesita atención','Recovering':'Recuperándose'})[s]||s||'Sin estado'}
function eventLabel(t){return ({Watered:'Riego',Fertilized:'Abonado',Pruned:'Poda',Rotated:'Rotación',Repotted:'Trasplante','Leaves cleaned':'Limpieza de hojas',Other:'Otro'})[t]||t||'Evento'}
function methodLabel(t){return ({Water:'Agua',Soil:'Tierra',Sphagnum:'Esfagno',Perlite:'Perlita','Air layering':'Acodo aéreo'})[t]||t||''}
function healthStatusLabel(t){return ({Monitoring:'En observación',Improving:'Mejorando',Recovered:'Recuperada',Ongoing:'En curso'})[t]||t||''}
function propagationStatusLabel(t){return ({Starting:'Iniciando',Rooting:'Enraizando',Established:'Establecida',Failed:'Fallida'})[t]||t||''}

function render(){
  const app=document.getElementById('app');
  app.innerHTML=header()+main()+nav();
}
function header(){return `<header><div class="brand"><h1>La Viva Natura</h1><p>Cuida · Cultiva · Observa</p></div><button class="iconbtn" onclick="openPlantForm()">+</button></header>`}
function main(){return `<main>${screen==='home'?home():screen==='plants'?plantsView():journalView()}</main>${selected?detailSheet():''}`}
function nav(){return `<nav><div class="navinner">
<button class="${screen==='home'?'active':''}" onclick="go('home')"><span class="ni">⌂</span>Inicio</button>
<button class="${screen==='plants'?'active':''}" onclick="go('plants')"><span class="ni">🪴</span>Plantas</button>
<button class="${screen==='journal'?'active':''}" onclick="go('journal')"><span class="ni">📖</span>Diario</button>
</div></nav>`}

function home(){
 const att=plants.filter(attention).length, prop=plants.filter(p=>p.propagations.length).length;
 const recent=[...plants].sort((a,b)=>(b.events?.[0]?.date||'').localeCompare(a.events?.[0]?.date||'')).slice(0,3);
 return `<section class="hero"><h2>Un pequeño hogar para tus plantas.</h2><p>Registra las plantas que quieres y acompáñalas en cada pequeño momento.</p></section>
 <div class="stats"><div class="stat"><strong>${plants.length}</strong><span>plantas</span></div><div class="stat"><strong>${att}</strong><span>necesitan atención</span></div><div class="stat"><strong>${prop}</strong><span>en propagación</span></div></div>
 <div class="sectionhead"><h3>Mis plantas</h3><button class="linkbtn" onclick="go('plants')">Ver todas →</button></div>
 ${recent.map(plantCard).join('')||'<div class="empty">Añade tu primera planta con el botón +.</div>'}
 <div class="sectionhead"><h3>Cuidados rápidos</h3></div>
 <div class="quick">
  <div class="quickrow" onclick="go('plants')"><div class="qicon">💧</div><div><strong>Cuidados</strong><span>Riega, abona, poda, gira la planta y mucho más.</span></div></div>
  <div class="quickrow" onclick="go('journal')"><div class="qicon">🌱</div><div><strong>Momentos de crecimiento</strong><span>Guarda nuevas hojas, flores y pequeños cambios.</span></div></div>
 </div>`;
}
function plantCard(p){return `<div class="plant-card ${attention(p)?'due':''}" onclick="openDetail('${p.id}')"><div class="thumb">${plantThumb(p)}</div><div class="plant-info"><h4>${esc(p.name||'Planta sin nombre')}</h4><p>${esc(p.species||'Especie sin indicar')}</p><p>${esc(p.location||'Sin ubicación')} · ${esc(p.light||'Luz sin indicar')}</p></div><span class="pill ${attention(p)?'badgeAttention':''}">${attention(p)?'💧 Toca regar':esc(statusLabel(p.status))}</span></div>`}

function plantsView(){
 const list=plants.filter(p=>(p.name+' '+(p.species||'')+' '+p.location+' '+p.status).toLowerCase().includes(search.toLowerCase())).filter(p=>filter==='all'||p.status===filter);
 const statuses=[...new Set(plants.map(p=>p.status).filter(Boolean))];
 return `<div class="sectionhead"><h3>Mi colección de plantas</h3></div>
 <div class="search"><input placeholder="Buscar plantas..." value="${esc(search)}" oninput="search=this.value;render()"><select class="filter" onchange="filter=this.value;render()"><option value="all">Todas</option>${statuses.map(s=>`<option value="${esc(s)}" ${filter===s?'selected':''}>${esc(statusLabel(s))}</option>`).join('')}</select></div>
 ${list.map(plantCard).join('')||'<div class="empty">No hay plantas que coincidan con tu búsqueda.</div>'}
 <button class="fab" onclick="openPlantForm()">+</button>`;
}

function journalView(){
 const entries=[...journal].sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="sectionhead"><h3>Diario botánico</h3><button class="secondary" onclick="openJournalForm()">+ Momento</button></div>
 ${entries.map(e=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><strong>${esc(e.title)}</strong><small>${esc(e.date)}</small></div><p style="margin:7px 0;color:#68766e">${esc(e.note||'')}</p>${e.photo?`<div class="miniPhoto" style="max-width:150px"><img src="${e.photo}"></div>`:''}<small>${esc(getPlant(e.plantId)?.name||'Diario general')}</small></div>`).join('')||'<div class="empty">Tu primer momento botánico aparecerá aquí.</div>'}`;
}

function overlay(inner){return `<div class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet">${inner}</div></div>`}
function detailSheet(){
 const p=getPlant(selected); if(!p)return '';
 const tabs=[['summary','Resumen'],['care','Cuidados'],['growth','Crecimiento'],['health','Salud'],['prop','Propagación'],['journal','Diario']];
 return overlay(`<div class="sheethead"><h2>${esc(p.name||'Planta')}</h2><button class="close" onclick="closeSheet()">×</button></div>
 <div class="detailHero"><div class="detailPhoto">${plantThumb(p,true)}</div><div><h2>${esc(p.name||'Planta')}</h2><p style="font-family:Georgia,serif;font-style:italic;margin-bottom:6px">${esc(p.species||'Especie sin indicar')}</p><p>${esc(p.location||'Sin ubicación')} · ${esc(p.light||'Luz sin indicar')}</p><span class="pill">${esc(statusLabel(p.status))}</span></div></div>
 <div class="tabs">${tabs.map(([k,l])=>`<button class="${detailTab===k?'active':''}" onclick="setDetailTab('${k}')">${l}</button>`).join('')}</div>
 ${detailTab==='summary'?profileSummary(p):''}
 ${detailTab==='care'?profileCare(p):''}
 ${detailTab==='growth'?profileGrowth(p):''}
 ${detailTab==='health'?profileHealth(p):''}
 ${detailTab==='prop'?profilePropagation(p):''}
 ${detailTab==='journal'?profileJournal(p):''}`);
}
function setDetailTab(tab){detailTab=tab;render()}
function profileSummary(p){
 const n=nextWater(p), events=p.events||[], last=events[0];
 return `<div class="profileGrid">
 <div class="stat"><strong>${events.length}</strong><span>cuidados registrados</span></div>
 <div class="stat"><strong>${p.propagations.length}</strong><span>propagaciones</span></div>
 <div class="stat"><strong>${p.health.length}</strong><span>registros de salud</span></div>
 </div>
 <div class="card ${attention(p)?'due':''}"><strong>💧 Ritmo de riego</strong><p style="color:#6e786f">Cada ${p.wateringEvery||7} días. ${n?(attention(p)?'Puede tocar riego hoy.':'Próximo riego: '+n):'Todavía no hay un riego registrado.'}</p><div class="actions"><button class="primary" onclick="quickWater('${p.id}')">💧 Regada hoy</button><button class="secondary" onclick="openCareForm('${p.id}')">Registrar cuidado</button></div></div>
 <div class="card"><strong>🌿 Sobre esta planta</strong><p style="font-family:Georgia,serif;font-style:italic;color:#68766e">${esc(p.species||'Especie sin indicar')}</p><p style="color:#68766e">${esc(p.notes||'Aún no has añadido notas sobre esta planta.')}</p><button class="secondary" onclick="openPlantForm('${p.id}')">Editar perfil</button></div>
 <div class="sectionhead"><h3>Últimos movimientos</h3><button class="linkbtn" onclick="setDetailTab('growth')">Ver historial →</button></div>
 <div class="timeline">${timeline(p).slice(0,4).join('')||'<div class="empty">Todavía no hay actividad registrada.</div>'}</div>
 <div class="sectionhead"><h3>Fotos</h3><button class="linkbtn" onclick="openPlantForm('${p.id}')">+ Foto</button></div>
 ${p.photos?.length?`<div class="photoRow">${p.photos.map(x=>`<div class="miniPhoto"><img src="${x}"></div>`).join('')}</div>`:'<div class="empty">Añade una foto para empezar a documentar su crecimiento.</div>'}
 <div class="actions"><button class="danger" onclick="deletePlant('${p.id}')">Eliminar planta</button></div>`;
}
function profileCare(p){
 return `<div class="sectionhead"><h3>Historial de cuidados</h3><button class="secondary" onclick="openCareForm('${p.id}')">+ Cuidado</button></div>
 <div class="card"><strong>💧 Próximo riego</strong><p style="color:#68766e">${nextWater(p)?(attention(p)?'El riego está pendiente.':'Previsto para '+nextWater(p)):'Registra el primer riego para calcularlo.'}</p><button class="primary" onclick="quickWater('${p.id}')">💧 Regada hoy</button></div>
 <div class="timeline">${timeline(p).join('')||'<div class="empty">Todavía no hay cuidados registrados.</div>'}</div>`;
}
function profileGrowth(p){
 const all=[];
 (p.events||[]).forEach(e=>all.push({date:e.date,icon:iconFor(e.type),title:eventLabel(e.type),note:e.note||'',kind:'Cuidado'}));
 (p.propagations||[]).forEach(x=>all.push({date:x.date,icon:'🌱',title:'Propagación · '+(x.name||'Esqueje'),note:(methodLabel(x.method)+' · '+propagationStatusLabel(x.status)),kind:'Propagación'}));
 (p.health||[]).forEach(x=>all.push({date:x.date,icon:'🩺',title:x.issue,note:(healthStatusLabel(x.status||'Monitoring')+(x.treatment?' · '+x.treatment:'')),kind:'Salud'}));
 journal.filter(x=>x.plantId===p.id).forEach(x=>all.push({date:x.date,icon:'📖',title:x.title,note:x.note||'',kind:'Diario'}));
 all.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 return `<div class="sectionhead"><h3>Historia de ${esc(p.name)}</h3></div><div class="card"><strong>🌿 Una pequeña historia, cuidado a cuidado.</strong><p style="color:#68766e;margin-bottom:0">Aquí se reúnen riegos, cambios, salud, propagaciones y momentos del diario para que puedas ver la evolución de tu planta.</p></div>
 <div class="timeline">${all.map(x=>`<div class="event"><strong>${x.icon} ${esc(x.title)}</strong><small>${esc(x.date||'')} · ${esc(x.kind)}</small>${x.note?`<p>${esc(x.note)}</p>`:''}</div>`).join('')||'<div class="empty">Aún no hay momentos que mostrar.</div>'}</div>`;
}
function profileHealth(p){
 return `<div class="sectionhead"><h3>Salud de la planta</h3><button class="secondary" onclick="openHealthForm('${p.id}')">+ Registro</button></div>
 <div class="card"><strong>🩺 Seguimiento</strong><p style="color:#68766e">Registra síntomas, cambios, tratamientos y recuperación para poder consultar qué ocurrió con el tiempo.</p></div>
 ${p.health.map(healthCard).join('')||'<div class="empty">Todavía no hay problemas de salud registrados.</div>'}`;
}
function profilePropagation(p){
 return `<div class="sectionhead"><h3>Propagación</h3><button class="secondary" onclick="openPropagationForm('${p.id}')">+ Esqueje</button></div>
 <div class="card"><strong>🌱 Sigue cada pequeño comienzo</strong><p style="color:#68766e">Guarda el método, fecha de inicio, hormona, observaciones y evolución de cada propagación.</p></div>
 ${p.propagations.map(propCard).join('')||'<div class="empty">Todavía no hay propagaciones registradas.</div>'}`;
}
function profileJournal(p){
 const entries=journal.filter(x=>x.plantId===p.id).sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="sectionhead"><h3>Diario de ${esc(p.name)}</h3><button class="secondary" onclick="openJournalForm()">+ Momento</button></div>
 ${entries.map(e=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><strong>${esc(e.title)}</strong><small>${esc(e.date)}</small></div><p style="margin:7px 0;color:#68766e">${esc(e.note||'')}</p></div>`).join('')||'<div class="empty">Todavía no has guardado momentos de esta planta.</div>'}`;
}
function timeline(p){return [...(p.events||[])].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="event"><strong>${iconFor(e.type)} ${esc(eventLabel(e.type))}</strong><small>${esc(e.date)}</small>${e.note?`<p>${esc(e.note)}</p>`:''}</div>`)}
function iconFor(t){return ({Watered:'💧',Fertilized:'🌿',Pruned:'✂️',Rotated:'↻',Repotted:'🪴','Leaves cleaned':'🍃',Other:'•'})[t]||'•'}
function propCard(x){return `<div class="card"><strong>🌱 ${esc(x.name||'Propagación')}</strong><p>${esc(x.date||'')} · ${esc(methodLabel(x.method))} · ${esc(propagationStatusLabel(x.status))}</p>${x.observations?`<small>${esc(x.observations)}</small>`:''}</div>`}
function healthCard(x){return `<div class="card"><strong>🩺 ${esc(x.issue)}</strong><p>${esc(x.date||'')} · ${esc(healthStatusLabel(x.status||'Monitoring'))}</p>${x.symptoms?`<p>${esc(x.symptoms)}</p>`:''}${x.treatment?`<small>Tratamiento: ${esc(x.treatment)}</small>`:''}</div>`}

function formShell(title,body){return overlay(`<div class="sheethead"><h2>${title}</h2><button class="close" onclick="closeSheet()">×</button></div>${body}`)}
function openPlantForm(id){
 const p=id?getPlant(id):null;
 selected=null;
 const photo=p?.photos?.[0]||'';
 document.body.insertAdjacentHTML('beforeend',formShell(p?'Editar planta':'Añadir planta',`
 <form id="plantForm" onsubmit="savePlant(event,'${id||''}')">
 <div class="photoBox" id="plantPhotoPreview">${photo?`<img src="${photo}">`:'<label>📷 Añadir foto de la planta<input id="plantPhoto" type="file" accept="image/*" hidden onchange="previewImage(this)"></label>'}</div>
 ${photo?`<button type="button" class="secondary" onclick="document.getElementById('plantPhoto').click()">Cambiar foto</button><input id="plantPhoto" type="file" accept="image/*" hidden onchange="previewImage(this)">`:''}
 <div class="formgrid">
 <div class="field"><label>Nombre para identificarla</label><input name="name" required placeholder="Ej. Monstera del salón, Luna..." value="${esc(p?.name||'')}"></div>
 <div class="field"><label>Especie</label><input name="species" placeholder="Ej. Monstera deliciosa" value="${esc(p?.species||'')}"></div>
 <div class="field"><label>Estado</label><select name="status">${['Healthy & happy','Flowering','Growing','Propagating','Needs attention','Recovering'].map(x=>`<option value="${esc(x)}" ${p?.status===x?'selected':''}>${esc(statusLabel(x))}</option>`).join('')}</select></div>
 <div class="field"><label>Ubicación</label><input name="location" value="${esc(p?.location||'')}"></div>
 <div class="field"><label>Luz</label><input name="light" value="${esc(p?.light||'')}"></div>
 <div class="field"><label>Riego cada (días)</label><input name="wateringEvery" type="number" min="1" max="60" value="${p?.wateringEvery||7}"></div>
 <div class="field full"><label>Notas</label><textarea name="notes">${esc(p?.notes||'')}</textarea></div>
 </div><div class="actions"><button class="primary" type="submit">Guardar planta</button><button class="secondary" type="button" onclick="closeSheet()">Cancelar</button></div>
 </form>`));
 if(photo){document.getElementById('plantPhoto').addEventListener('change',previewImage)}
}
let pendingPhoto='';
async function previewImage(input){if(!input.files?.[0])return;pendingPhoto=await compressImage(input.files[0]);document.getElementById('plantPhotoPreview').innerHTML=`<img src="${pendingPhoto}">`}
function compressImage(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};img.src=r.result};r.readAsDataURL(file)})}
function savePlant(ev,id){ev.preventDefault();const f=new FormData(ev.target), old=id?getPlant(id):null;const p=old||{id:uid(),events:[],propagations:[],health:[],photos:[]};Object.assign(p,{name:f.get('name'),species:f.get('species'),status:f.get('status'),location:f.get('location'),light:f.get('light'),wateringEvery:Number(f.get('wateringEvery'))||7,notes:f.get('notes')});if(pendingPhoto)p.photos=[pendingPhoto,...(p.photos||[]).slice(0,5)];if(!old)plants.unshift(p);pendingPhoto='';save();closeSheet();render();openDetail(p.id)}
function openCareForm(id){closeSheet();setTimeout(()=>document.body.insertAdjacentHTML('beforeend',formShell('Registrar cuidado',`<form onsubmit="saveCare(event,'${id}')"><div class="formgrid"><div class="field"><label>Tipo de cuidado</label><select name="type">${['Watered','Fertilized','Pruned','Rotated','Repotted','Leaves cleaned','Other'].map(x=>`<option value="${esc(x)}">${esc(eventLabel(x))}</option>`).join('')}</select></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}"></div><div class="field full"><label>Observación</label><textarea name="note" placeholder="¿Qué has observado?"></textarea></div></div><div class="actions"><button class="primary">Guardar evento</button></div></form>`)),10)}
function saveCare(e,id){e.preventDefault();const p=getPlant(id),f=new FormData(e.target);p.events.unshift({id:uid(),type:f.get('type'),date:f.get('date'),note:f.get('note')});save();closeSheet();openDetail(id)}
function quickWater(id){const p=getPlant(id);p.events.unshift({id:uid(),type:'Watered',date:today(),note:''});save();closeSheet();openDetail(id)}
function openPropagationForm(id){closeSheet();setTimeout(()=>document.body.insertAdjacentHTML('beforeend',formShell('Nueva propagación',`<form onsubmit="savePropagation(event,'${id}')"><div class="formgrid"><div class="field"><label>Nombre</label><input name="name" placeholder="Cutting 1"></div><div class="field"><label>Fecha de inicio</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>Método</label><select name="method"><option value="Water">Agua</option><option value="Soil">Tierra</option><option value="Sphagnum">Esfagno</option><option value="Perlite">Perlita</option><option value="Air layering">Acodo aéreo</option></select></div><div class="field"><label>Hormona de enraizamiento</label><select name="hormone"><option value="No">No</option><option value="Yes">Sí</option></select></div><div class="field"><label>Estado</label><select name="status"><option value="Starting">Iniciando</option><option value="Rooting">Enraizando</option><option value="Established">Establecida</option><option value="Failed">Fallida</option></select></div><div class="field full"><label>Observaciones</label><textarea name="observations" placeholder="Cambios de agua, raíces, nuevos brotes..."></textarea></div></div><div class="actions"><button class="primary">Guardar propagación</button></div></form>`)),10)}
function savePropagation(e,id){e.preventDefault();const p=getPlant(id),f=new FormData(e.target);p.propagations.unshift({id:uid(),name:f.get('name'),date:f.get('date'),method:f.get('method'),hormone:f.get('hormone'),status:f.get('status'),observations:f.get('observations'),photos:[]});save();closeSheet();openDetail(id)}
function openHealthForm(id){closeSheet();setTimeout(()=>document.body.insertAdjacentHTML('beforeend',formShell('Salud de la planta',`<form onsubmit="saveHealth(event,'${id}')"><div class="formgrid"><div class="field"><label>Problema</label><input name="issue" required placeholder="Hojas amarillas, plagas..."></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}"></div><div class="field full"><label>Síntomas</label><textarea name="symptoms"></textarea></div><div class="field full"><label>Tratamiento / cambio realizado</label><textarea name="treatment"></textarea></div><div class="field"><label>Estado</label><select name="status"><option value="Monitoring">En observación</option><option value="Improving">Mejorando</option><option value="Recovered">Recuperada</option><option value="Ongoing">En curso</option></select></div></div><div class="actions"><button class="primary">Guardar registro de salud</button></div></form>`)),10)}
function saveHealth(e,id){e.preventDefault();const p=getPlant(id),f=new FormData(e.target);p.health.unshift({id:uid(),issue:f.get('issue'),date:f.get('date'),symptoms:f.get('symptoms'),treatment:f.get('treatment'),status:f.get('status')});save();closeSheet();openDetail(id)}
function openJournalForm(){document.body.insertAdjacentHTML('beforeend',formShell('Nuevo momento botánico',`<form onsubmit="saveJournal(event)"><div class="formgrid"><div class="field"><label>Planta</label><select name="plantId"><option value="">General</option>${plants.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}"></div><div class="field full"><label>¿Qué ha pasado?</label><input name="title" required placeholder="Ha aparecido una hoja nueva"></div><div class="field full"><label>Notas</label><textarea name="note"></textarea></div></div><div class="actions"><button class="primary">Guardar momento</button></div></form>`))}
function saveJournal(e){e.preventDefault();const f=new FormData(e.target);journal.unshift({id:uid(),plantId:f.get('plantId'),date:f.get('date'),title:f.get('title'),note:f.get('note')});save();closeSheet();go('journal')}
function openDetail(id){selected=id;detailTab='summary';render()}
function closeSheet(){document.querySelectorAll('.overlay').forEach(x=>x.remove());selected=null}
function deletePlant(id){if(confirm('¿Eliminar esta planta?')){plants=plants.filter(p=>p.id!==id);save();closeSheet();render()}}
function go(s){screen=s;selected=null;render()}
load();render();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js?v=4.2-es').then(r=>r.update()).catch(()=>{}); }
</script>
</body>
</html>
